project:
  type: website
  output-dir: docs
  resources:
    - ".nojekyll"
    - "!_site/**"
    - "!docs/**"
    - "assets/custom.css"
    - "assets/refonte.css"
    - "assets/design/**"
    - "assets/fonts/**"
    - "!.diagnostics/**"
    - "!design-qa.md"
    - "!_includes/title-block.html"
    - "!metadata/**"
    - "!scripts/**"
    - "!data/**"
    - "assets/logo.svg"
    - "Example Recipes.pdf"
    - "cv/*.pdf"
    - "en/cv/*.pdf"
    - "presentations/au-dela-du-prompt/diaporama/**"
    - "presentations/au-dela-du-prompt/*.pdf"
    - "presentations/au-dela-du-prompt/ressources/**"
  render:
    - "*.qmd"
    - "**/*.qmd"

