format:
  html:
    theme: cosmo
    embed-resources: true
    grid:
      body-width: 1120px
      sidebar-width: 220px
      margin-width: 220px
      gutter-width: 1.5rem
    css:
      - assets/custom.css
      - assets/refonte.css
    template-partials:
      - _includes/title-block.html
    include-in-header:
      - assets/language-switch.js
    toc: true
    anchor-sections: true
    link-external-newwindow: true
    smooth-scroll: true

lang: fr-CA
execute:
  freeze: auto
